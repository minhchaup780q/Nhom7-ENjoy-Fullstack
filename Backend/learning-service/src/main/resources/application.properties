# Service configuration
spring.application.name=learning-service
server.port=8081

# Database configuration (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/enjoy_learning_db?serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# JPA and Hibernate configuration
# update: Hibernate vẫn tự tạo/cập nhật bảng từ @Entity như trước
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Flyway configuration
# enabled=false: tắt tự chạy lúc khởi động (vì bảng chưa được Hibernate tạo xong).
# Flyway sẽ được chạy thủ công sau khi Hibernate tạo xong bảng (xem FlywayConfig.java).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Eureka Client
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=50

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms

# AWS S3 (lưu ảnh/audio của đề thi do Admin tải lên)
aws.s3.bucket-name=minhchau-22662231-bucket
aws.s3.region=ap-southeast-1
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Giới hạn dung lượng file tải lên (ảnh/audio đề thi)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


